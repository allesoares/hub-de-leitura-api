$kind: http-request
description: Administrador autenticado
url: '{{baseUrl}}/api/login'
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{adminEmail}}",
      "password": "{{adminPassword}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', function () {
        pm.response.to.have.status(200);
      });

      const data = pm.response.json();

      pm.test('Administrador autenticado', function () {
        pm.expect(data.isAdmin).to.eql(true);
        pm.expect(data.token_for_swagger).to.be.a('string').and.not.empty;
      });

      pm.collectionVariables.set('adminToken', data.token_for_swagger);
    language: text/javascript
order: 1000
